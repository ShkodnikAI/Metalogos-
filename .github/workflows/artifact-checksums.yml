name: Artifact checksums (non-blocking)

# Наряд №1011 (issue #2085, P2, [ci][process]): SHA256SUMS-манифест артефактов.
# ТОЛЬКО workflow_dispatch — никогда не на push/PR, вне required checks
# (non-blocking по построению, прецедент edge-profile/stress-audit-ops).
# Лane собирает свежие артефакты репо, считает SHA256 каждого zip-а и
# публикует артефакт artifact-checksums (SHA256SUMS + MANIFEST).

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: collect artifacts, hash, publish SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p zips out
          page=1
          while : ; do
            resp="artifacts_page_${page}.json"
            curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/artifacts?per_page=100&page=${page}" > "$resp"
            count=$(jq '.artifacts | length' "$resp")
            jq -r '.artifacts[] | select(.expired == false) | [.id, .name, .size_in_bytes, .created_at, .head_sha, (.workflow_run.run_id|tostring)] | @tsv' \
              "$resp" >> artifact_list.tsv
            [ "$count" -lt 100 ] && break
            page=$((page+1))
            [ "$page" -gt 5 ] && break
          done
          total=$(wc -l < artifact_list.tsv)
          echo "artifacts to hash: ${total}"
          # качаем и хэшируем каждый zip; имя включает id — имена артефактов могут повторяться
          while IFS=$'\t' read -r id name size created sha runid; do
            safe=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')
            fn="zips/${safe}_${id}.zip"
            curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${id}/zip" -o "$fn"
            h=$(sha256sum "$fn" | cut -d' ' -f1)
            echo "${h}  ${safe}_${id}.zip" >> out/SHA256SUMS
            # №1020 (P2): the platform column is VERIFIED, not trusted — the
            # binfmt probe on the inner binary, never the artifact name (a
            # probe/name disagreement is a warning, the probe wins). An
            # artifact without a mlog binary inside carries none/-.
            plat="none"; inner="-"
            rm -rf probe && mkdir probe
            if unzip -q -o "$fn" -d probe 2>/dev/null; then
              b=$(find probe -type f \( -name mlog -o -name mlog.exe \) | head -1)
              if [ -n "$b" ]; then
                case "$(file -b "$b")" in
                  *"ELF 64-bit"*"ARM aarch64"*) plat=linux-arm64 ;;
                  *"ELF 64-bit"*"x86-64"*)      plat=linux-x86_64 ;;
                  *"Mach-O"*"arm64"*)           plat=darwin-arm64 ;;
                  *"Mach-O"*"x86_64"*)          plat=darwin-x86_64 ;;
                  *"PE32+"*"x86-64"*)           plat=windows-x86_64 ;;
                  *)                            plat=unknown ;;
                esac
                inner=$(sha256sum "$b" | cut -d' ' -f1)
                case "$name" in
                  *"$plat"*) : ;;
                  *) echo "::warning::platform probe ${plat} is not in artifact name ${name} (probe wins)" ;;
                esac
                echo "${inner}  mlog-${plat}_${id}" >> out/SHA256SUMS-INNER
              fi
            else
              echo "::warning::artifact ${id} (${name}) is not a zip — container hash only"
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$name" "$size" "$created" "$sha" "$runid" "$plat" "$inner" >> out/MANIFEST.tsv
          done < artifact_list.tsv
          {
            echo "generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "artifacts hashed: ${total}"
            echo "column order: artifact_id, name, size_bytes, created_at, head_sha, run_id, platform, inner_binary_sha256"
            echo "SHA256SUMS hashes the artifact zip containers; SHA256SUMS-INNER hashes the inner mlog binaries (probe-verified platform in the name), one line per binary-bearing artifact."
          } > out/README.txt
          ls -la out
          test -s out/SHA256SUMS || { echo "::warning::no artifacts hashed (nothing fresh)"; }
      - name: upload the checksums artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-checksums
          path: out/

name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --bin mlog

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: mlog-linux-x86_64
          path: target/release/mlog
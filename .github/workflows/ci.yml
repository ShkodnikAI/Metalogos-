name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-lib:
    name: test-lib (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Guard against large files
        run: |
          find . -type f -size +50M -not -path './.git/*' | tee /tmp/large.txt
          if [ -s /tmp/large.txt ]; then
            echo "::error::Found files > 50MB. Add to .gitignore or use Git LFS."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Library tests
        run: cargo test --workspace --lib --no-fail-fast

  crosscheck:
    name: crosscheck (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: TW vs VM parity
        run: cargo test --workspace --test crosscheck_backends --no-fail-fast

  candle-tests:
    name: candle-tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: candle-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Library tests (feature-gated, includes src/nn/ unit tests)
        run: cargo test --workspace --lib --features candle --no-fail-fast
      - name: Reflex pillar integration tests (candle-gated)
        run: |
          cargo test --workspace --features candle --no-fail-fast \
            --test naryad_183_attention_forward \
            --test naryad_184_rmsnorm_forward \
            --test naryad_184_swiglu_forward \
            --test naryad_184_transformer_block_forward \
            --test naryad_185_seq_convergence \
            --test naryad_188_gqa_forward \
            --test naryad_190_single_block_regression \
            --test naryad_190_stack_forward \
            --test naryad_190_stack_training \
            --test naryad_190_stack_weights \
            --test naryad_192_gqa_stack_forward \
            --test naryad_192_gqa_stack_training \
            --test naryad_193_gen_sanity_check \
            --test naryad_194_vocab_overflow \
            --test naryad_196_batch_matches_single \
            --test naryad_196_batching_speedup \
            --test naryad_196_padding_mask_correctness \
            --test naryad_199_vm_reflex_train_predict \
            --test naryad_199_vm_matches_tw_determinism \
            --test crosscheck_backends \
            --test golden \
            --test registry_arity_check
      - name: Clippy on gated code
        run: cargo clippy --workspace --features candle --all-targets -- -D warnings

  vision-tests:
    name: vision-tests (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vision-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Guard — vision must NOT be in default/full features
        run: |
          if grep -E '^(default|full) = ' Cargo.toml | grep -q 'vision'; then
            echo "::error::vision feature must stay off-by-default (ADR-0122, naryad 210)"; exit 1; fi
      - name: Build with vision feature
        run: cargo build --workspace --features vision
      - name: Library tests (includes naryad_210 skeleton tests)
        run: cargo test --workspace --lib --features vision --no-fail-fast
      - name: Vision skeleton integration tests
        run: cargo test --workspace --features vision --no-fail-fast --test naryad_210_vision_skeleton
      - name: Vision R2 text encoder golden contract
        run: cargo test --workspace --features vision --no-fail-fast --test naryad_211_text_encoder_golden
      - name: Clippy on vision-gated code
        run: cargo clippy --workspace --features vision --all-targets -- -D warnings

  registry-arity-check:
    name: registry-arity-check (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Registry/dispatcher arity sync
        run: cargo test --workspace --test registry_arity_check --no-fail-fast

  test-llm-cache-contract:
    name: test-llm-cache-contract (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: LLM cache contract tests
        run: cargo test --workspace --test llm_cache_contract --no-fail-fast

  minimal-build:
    name: minimal-build (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build with minimal features (no server/llm)
        run: cargo build --release --no-default-features --features "svg,chart,diagram,template"

  test-integration:
    name: test-integration (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Integration tests (excluding blocking tests)
        run: cargo test --workspace --tests --no-fail-fast -- --skip crosscheck --skip registry_arity_check --skip llm_cache_contract

  fmt:
    name: fmt (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check

  clippy:
    name: clippy (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  adr-check:
    name: ADR numbering (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ADR numbering collision check
        run: |
          dupes=$(ls docs/adr/ | sed -E 's/^([0-9]+)-.*/\1/' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate ADR numbers found: $dupes"
            exit 1
          fi

  module-size-guard:
    name: module-size-guard (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check per-module LOC limits (src/builtins/*.rs)
        run: |
          HARD_LIMIT=5000
          WARNING_LIMIT=4000
          violations=""
          warnings=""
          for f in $(find src/builtins -name '*.rs' -not -path '*/tests*'); do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt "$HARD_LIMIT" ]; then
              violations="$violations\n  $f: $lines lines (HARD LIMIT $HARD_LIMIT exceeded)"
            elif [ "$lines" -gt "$WARNING_LIMIT" ]; then
              warnings="$warnings\n  $f: $lines lines (warning threshold $WARNING_LIMIT exceeded)"
            fi
          done
          if [ -n "$violations" ]; then
            echo -e "::error::Hard limit violations:$violations"
            exit 1
          fi
          if [ -n "$warnings" ]; then
            echo -e "::warning::Warning threshold exceeded:$warnings"
          fi
          echo "✓ All builtin modules within limits"

  vscode-extension:
    name: vscode-extension (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Compile TypeScript
        working-directory: editors/vscode
        run: npm run compile
      - name: Verify out/extension.js exists
        working-directory: editors/vscode
        run: |
          if [ ! -f out/extension.js ]; then
            echo "::error::out/extension.js not found after compile. package.json main: \"./out/extension.js\" points nowhere."
            exit 1
          fi
          echo "✓ out/extension.js exists ($(stat -c%s out/extension.js) bytes)"

  cargo-audit:
    name: cargo-audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: |
          # RUSTSEC-2026-0187 (lopdf stack overflow, severity 7.5):
          #   Our direct lopdf updated to 0.44 (safe). Remaining instance is
          #   transitive via pdf-inspector 0.1.x -> lopdf 0.41.0. Upgrading
          #   pdf-inspector to 1.x requires major API rewrite (classify_pdf_mem,
          #   process_pdf_mem, extract_text_with_positions_mem all changed).
          #   Tracked for resolution in a future naryad.
          cargo audit --ignore RUSTSEC-2026-0187

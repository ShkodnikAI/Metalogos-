name: Soak (nightly parity)

# Наряд №373 (ADR-0141 §D3/§D4, Stage 2): parity soak.
# Nightly full-parity run of the crosscheck + the whole test suite + doc-tests.
# Each green run accumulates 24h-soak evidence for the Stage 3 decision
# (default flip of `mlog serve`, ADR-0088 — решение диспатча №379).
# Manually dispatchable for on-demand soak evidence.

on:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

jobs:
  soak-parity:
    name: soak-parity (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      # Наряд №722 (issue #1341, волна 50): the ENOSPC guard. The 19.10
      # soak-parity failed at "Build debug binary" with "No space left
      # on device (os error 28)" after the three test phases (the В48
      # lesson class: the runner disk overflow). Free the pre-installed
      # runner bloat before the build phases; the df-h lines keep the
      # hygiene provable in the log.
      - name: Free runner disk (ENOSPC guard — №722, the В48 lesson)
        run: |
          echo "=== disk before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo "=== disk after:"
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Record soak start (UTC)
        run: |
          date +%s > /tmp/soak_start
          echo "soak run started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Lib tests
        run: cargo test --workspace --lib --no-fail-fast

      - name: Parity crosscheck (№373 gate — no VM-uncovered exclusions)
        run: cargo test --workspace --test crosscheck_backends --test naryad_373_parity_gate --no-fail-fast

      - name: Integration tests (full)
        run: cargo test --workspace --tests --no-fail-fast

      - name: Build debug binary for doc-tests/examples
        run: cargo build --workspace

      - name: Doc-tests on REFERENCE/README/docs (Naryad #287)
        run: ./target/debug/mlog test --docs

      - name: Soak report (duration, date)
        if: always()
        run: |
          END=$(date +%s)
          START=$(cat /tmp/soak_start)
          echo "═══ SOAK RUN REPORT ═══"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "duration: $(( (END-START)/60 )) min $(( (END-START)%60 )) s"
          echo "regressions: see job status above (any red step = a soak regression)"

  serve-soak:
    name: serve-soak (Fosved-class, VM default)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --workspace

      # Naryad №423 (issue #583): the audit-21.09-P0-2 soak — the real
      # `mlog serve` (VM default) under a Fosved-class seed: a native-cron
      # minute tick (№418), a granted destructive path (№390/№412) and an
      # exported signed ledger verified externally by the №415 CLI.
      # Any RED criterion fails the job — the nightly red IS the alert.
      - name: Fosved-class serve-soak
        run: ./scripts/soak/serve_soak.sh

      - name: Publish the serve-soak report
        if: always()
        run: |
          echo '### Fosved-class serve-soak' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/serve_soak_report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

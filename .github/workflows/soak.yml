name: Soak (nightly parity)

# Наряд №373 (ADR-0141 §D3/§D4, Stage 2): parity soak.
# Nightly full-parity run of the crosscheck + the whole test suite + doc-tests.
# Each green run accumulates 24h-soak evidence for the Stage 3 decision
# (default flip of `mlog serve`, ADR-0088 — решение диспатча №379).
# Manually dispatchable for on-demand soak evidence.

on:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC
  workflow_dispatch:

jobs:
  soak-parity:
    name: soak-parity (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Наряд №932 (issue #1871, волна 88): the ENOSPC guard extension.
    # CARGO_INCREMENTAL=0 — the incremental caches (target/debug/incremental)
    # are the largest single consumer the №722 guard does not touch; a one-shot
    # CI build gains nothing from them. CARGO_PROFILE_DEV_DEBUG=0 — the
    # dev-profile debuginfo is multi-GB and the soak machine needs a working
    # binary, not symbols; test behavior is unchanged (both settings are
    # build-artifact hygiene, not test-logic changes).
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      # Наряд №722 (issue #1341, волна 50): the ENOSPC guard. The 19.10
      # soak-parity failed at "Build debug binary" with "No space left
      # on device (os error 28)" after the three test phases (the В48
      # lesson class: the runner disk overflow). Free the pre-installed
      # runner bloat before the build phases; the df-h lines keep the
      # hygiene provable in the log. №932 (the 07.11 ENOSPC on c70e25af,
      # AFTER this guard ran): the guard is necessary but not sufficient
      # on the grown tree — the extension lives in the job env above and
      # the inter-phase checkpoints below (the df-h hygiene stays provable).
      - name: Free runner disk (ENOSPC guard — №722, the В48 lesson; extended by №932)
        run: |
          echo "=== disk before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean || true
          echo "=== disk after:"
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Record soak start (UTC)
        run: |
          date +%s > /tmp/soak_start
          echo "soak run started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Lib tests
        run: cargo test --workspace --lib --no-fail-fast

      - name: Inter-phase disk checkpoint 1/2 (№932)
        run: |
          echo "=== disk after lib tests (phase 1/5):"
          df -h /
          du -sh target/debug/incremental 2>/dev/null || echo "no incremental dir"
          rm -rf target/debug/incremental || true

      - name: Parity crosscheck (№373 gate — no VM-uncovered exclusions)
        run: cargo test --workspace --test crosscheck_backends --test naryad_373_parity_gate --no-fail-fast

      - name: Integration tests (full)
        run: cargo test --workspace --tests --no-fail-fast

      # №932: the inter-phase disk checkpoints — the df-h line after every
      # cargo phase keeps the hygiene provable; the incremental-cache sweep
      # between phases reclaims what the phases leave behind even when the
      # env knobs above are bypassed by a future toolchain change.
      - name: Inter-phase disk checkpoint 2/2 (№932)
        run: |
          echo "=== disk after integration tests (phase 4/5):"
          df -h /
          rm -rf target/debug/incremental || true
          du -sh target 2>/dev/null || true

      # №932: the loud threshold BEFORE the doc-tests build — a clear
      # «ENOSPC PREVENTED» red here beats a disk-full crash mid-build
      # (the 07.11 failure mode: os error 28 inside the build step).
      - name: Pre-doc-tests disk threshold (№932 — fail fast, loud)
        run: |
          FREE_KB=$(df -k / | awk 'NR==2 {print $4}')
          echo "free space before doc-tests: $((FREE_KB/1024)) MiB"
          if [ "$FREE_KB" -lt 2097152 ]; then
            echo "ENOSPC PREVENTED (№932 threshold): fewer than 2 GiB free before the doc-tests build — stopping here, loudly."
            df -h /
            exit 1
          fi

      - name: Build debug binary for doc-tests/examples
        run: cargo build --workspace

      - name: Doc-tests on REFERENCE/README/docs (Naryad #287)
        run: ./target/debug/mlog test --docs

      - name: Soak report (duration, date)
        if: always()
        run: |
          END=$(date +%s)
          START=$(cat /tmp/soak_start)
          echo "═══ SOAK RUN REPORT ═══"
          echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "duration: $(( (END-START)/60 )) min $(( (END-START)%60 )) s"
          echo "regressions: see job status above (any red step = a soak regression)"

  serve-soak:
    name: serve-soak (Fosved-class, VM default)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --workspace

      # Naryad №423 (issue #583): the audit-21.09-P0-2 soak — the real
      # `mlog serve` (VM default) under a Fosved-class seed: a native-cron
      # minute tick (№418), a granted destructive path (№390/№412) and an
      # exported signed ledger verified externally by the №415 CLI.
      # Any RED criterion fails the job — the nightly red IS the alert.
      - name: Fosved-class serve-soak
        run: ./scripts/soak/serve_soak.sh

      - name: Publish the serve-soak report
        if: always()
        run: |
          echo '### Fosved-class serve-soak' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/serve_soak_report.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

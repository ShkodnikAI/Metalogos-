[package]
name = "metalogos"
version = "0.10.0"
edition = "2021"
description = "METALOGOS — AI-native programming language with security by design"

[[bin]]
name = "mlog"
path = "src/main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"

# Phase 6: Web platform
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "set-header"] }
hyper = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
bytes = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"], default-features = false }

# Phase 7.3: Real encryption
argon2 = "0.5"
zeroize = "1"

# Phase 7.4: Real sessions & CSRF
rusqlite = { version = "0.31", features = ["bundled"] }

# Наряд №4: Global lazy static for LLM usage tracking
once_cell = "1"

# v0.8.5: Cron scheduler (real cron expression parsing)
chrono = "0.4"

# v0.8.10: Memory Graph — petgraph for knowledge graph operations
petgraph = "0.7"

# v0.9.5: OpenPlanter-inspired features
strsim = "0.11"
crc32fast = "1.4"

[dev-dependencies]
tempfile = "3"

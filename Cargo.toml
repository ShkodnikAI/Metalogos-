[workspace]
members = [".", "mlogpkg", "mlog-lsp"]
resolver = "2"

[workspace.package]
version = "0.16.0"
edition = "2021"

[package]
name = "metalogos"
version.workspace = true
edition.workspace = true
description = "METALOGOS — AI-native programming language with security by design"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShkodnikAI/Metalogos-"

[[bin]]
name = "mlog"
path = "src/main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"

# Phase 6: Web platform
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "set-header"] }
hyper = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
bytes = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"], default-features = false }

# Phase 7.3: Real encryption
argon2 = "0.5"
zeroize = "1"

# Phase 7.4: Real sessions & CSRF
rusqlite = { version = "0.31", features = ["bundled"] }

# Наряд №29 §5.1: Lock-free concurrent HashMap for hot paths
dashmap = "6.1"

# Наряд №4: Global lazy static for LLM usage tracking
once_cell = "1"

# v0.8.5: Cron scheduler (real cron expression parsing)
chrono = "0.4"

# v0.8.10: Memory Graph — petgraph for knowledge graph operations
petgraph = "0.7"

# v0.11.0 (O-2): YAML support for config_load
serde_yaml = "0.9"

# v0.9.5: OpenPlanter-inspired features
strsim = "0.11"
crc32fast = "1.4"

# Наряд №48: PDF processing (native Rust, zero IPC)
pdf-inspector = "0.1"

# Наряд MLG-2: PDF manipulation (pure Rust, zero Python IPC)
lopdf = "0.34"

# Наряд №54: Regular expressions (linear-time, no backtracking)
regex = "1"

# Наряд MLG-4: Email (SMTP + IMAP, pure Rust)
lettre = { version = "0.11", features = ["builder", "smtp-transport", "native-tls"] }
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
imap-proto = "0.16"
native-tls = "0.2"

# Наряд MLG-5: Calendar (CalDAV + iCal, pure Rust)
ical = "0.8"
chrono-tz = "0.10"

# Наряд MLG-6: Contacts (CardDAV + vCard, pure Rust)
# vcard parsing is hand-rolled (no external crate needed); CardDAV uses reqwest

# Optional OCR support (requires system tesseract-ocr + training data)
# Enable with: cargo build --features pdf-ocr
[dependencies.tesseract]
version = "0.15"
optional = true

[features]
pdf-ocr = ["tesseract"]

[dev-dependencies]
tempfile = "3"
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "core_benchmarks"
harness = false

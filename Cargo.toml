[package]
name = "metalogos"
version = "0.4.0"
edition = "2021"
description = "METALOGOS — AI-native programming language with security by design"

[[bin]]
name = "mlog"
path = "src/main.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"

# Phase 6: Web platform
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "set-header"] }
hyper = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
bytes = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

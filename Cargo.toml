[workspace]
# №567 (gh#931; the crate-split stage 2): metalogos-server carries the
# transport contour (server, mcp_server, mcp_policy) AND the `mlog` bin
# — the Cargo package graph forbids metalogos -> metalogos-server ->
# metalogos, so the consumer edge lives in the transport crate itself
# (the bin links the language crate for the core; the root became a
# pure library).
members = [".", "metalogos-server", "mlogpkg", "mlog-lsp", "metalogos-reflex"]
resolver = "2"

[workspace.package]
version = "0.30.0"
edition = "2021"
# №528 (issue #837; audit 30.09 Д-4+N-5): the MSRV lives in the build
# contract — the resolver refuses older toolchains with a clear error.
# THE HONEST FLOOR IS 1.93.1, not the draft's 1.85: the locked tree's
# facts (verified by toolchain walk: 1.85 → weezl needs 1.88; 1.88 →
# rustyline needs 1.89 file_lock; 1.89 → serial_test needs 1.93.1;
# 1.93.1 → FULL check --workspace --all-targets green). The floor moves
# ONLY UP by an evidence-backed dependency fact, never silently.
rust-version = "1.93.1"

[package]
name = "metalogos"
version.workspace = true
edition.workspace = true
description = "METALOGOS — AI-native programming language with security by design"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShkodnikAI/Metalogos-"

# №567: the `mlog` bin moved to metalogos-server (see the members note)
# — the binary name, the CLI surface and the release pipeline
# (`cargo build --release --bin mlog`) are unchanged.
[dependencies]
# №545 (в): the reflex domain crate — the generative contour's home;
# unconditional (tiny without its candle/vision features) so the
# re-export shells compile in every profile.
metalogos-reflex = { path = "metalogos-reflex" }

pest = "2.7"
pest_derive = "2.7"
# №567: clap/rustyline moved with the bin (metalogos-server); libc stays
# — src/fs_gate.rs uses it.
libc = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bincode = { version = "2.0", default-features = false, features = ["serde", "std"] }
thiserror = "2.0"

# №567 (gh#931): the Phase 6 web stack (axum/tower/tower-http/hyper/
# tokio/futures-util — all formerly optional behind `server`) moved to
# metalogos-server/Cargo.toml as non-optional. The root crate pulls
# NEITHER axum NOR tokio in any feature combination anymore — the №278
# criterion (`cargo build --no-default-features` without the heavy
# stack) holds a fortiori; the proof is `cargo tree -e features` in the
# naryad report.
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
aes-gcm = "0.11"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
bytes = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"], default-features = false }

# Phase 7.3: Real encryption
argon2 = "0.6"
zeroize = "1"

# Naryad #393 (ADR-0167): Action Ledger v1 — Ed25519 signatures over the
# prev-hash chain. One new top-level crate (FEATURE_INTAKE §5 budget:
# warning 2, hard 5); hashing (sha2), hex and RNG (rand) were present.
ed25519-dalek = "3"

# Phase 7.4: Real sessions & CSRF
rusqlite = { version = "0.40", features = ["bundled"] }

# Наряд №272 (ADR-0134): sqlite-vec 0.1.9 (asg017, MIT) — KNN-ускоритель
# semantic recall поверх rusqlite. Статическая регистрация через
# sqlite3_auto_extension (feature load_extension НЕ нужна — факт-чек спайка №271).
sqlite-vec = { version = "0.1.9", optional = true }

# №567: dashmap moved with the transport (the only user was the server
# contour).
# Наряд №4: Global lazy static for LLM usage tracking
once_cell = "1"

# v0.8.5: Cron scheduler (real cron expression parsing)
chrono = "0.4"

# v0.8.10: Memory Graph — petgraph for knowledge graph operations
petgraph = "0.8"

# v0.11.0 (O-2): YAML support for config_load
serde_yaml = "0.9"

# v0.9.5: OpenPlanter-inspired features
strsim = "0.11"
crc32fast = "1.4"

# Наряд №48: PDF processing (native Rust, zero IPC)
pdf-inspector = "1.17"

# Наряд MLG-2: PDF manipulation (pure Rust, zero Python IPC)
lopdf = "0.45"

# Наряд №54: Regular expressions (linear-time, no backtracking)
regex = "1"

# Наряд MLG-4: Email (SMTP + IMAP, pure Rust)
lettre = { version = "0.11", features = ["builder", "smtp-transport", "native-tls"] }
# imap 3.0.0-alpha.15 — intentional choice, not an oversight (naryad №116 / ADR-0109).
# Stable 2.4.1 uses the older connect() API; our code (src/builtins/email.rs) is built
# on ClientBuilder, which exists only in the 3.0 line (not released stable yet; last
# crates.io release alpha.15 = 2025-02-08, development continues on crate main).
# Risk: pre-release dependency in production. Mitigation: version is pinned via
# Cargo.lock (no auto-update). Revisit when imap 3.0 stable ships — bump the version
# string only; API should stay compatible so email.rs need not be rewritten.
imap = { version = "3.0.0-alpha.15", features = ["native-tls"] }
imap-proto = "0.16"
native-tls = "0.2"

# Наряд MLG-5: Calendar (CalDAV + iCal, pure Rust)
ical = "0.11"
chrono-tz = "0.10"

# Наряд MLG-6: Contacts (CardDAV + vCard, pure Rust)
# vcard parsing is hand-rolled (no external crate needed); CardDAV uses reqwest

# Наряд №183 (ADR-0118): candle for architecture-block (SequenceLayer)
# extension — separate scope from the initial Reflex rollout
# (Наряды №177–182, which is dependency-free per ADR-0114).
# Feature-gated off-by-default via [features].candle in the features table below.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }

# Наряд №212 (R3): HF fast tokenizer + image save.
# Both gated under `vision` (NOT in default/full). tokenizers is the canonical
# HF BPE implementation — hand-rolling it is high-risk (see ADR-0124 update).
# image is for PNG encode of the VAE decoder output.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# Optional OCR support (requires system tesseract-ocr + training data)
# Enable with: cargo build --features pdf-ocr
[dependencies.tesseract]
version = "0.15"
optional = true

[features]
default = ["svg", "chart", "diagram", "template", "llm", "server"]

# Наряд №111: modular capability gates (opt-out via --no-default-features)
svg = []
chart = ["svg"]      # charts use shared + polar etc from svg module
diagram = ["svg"]    # diagrams.rs imports icon_path_data from primitives
template = []
llm = []
# Naryad #440: the off-process timesfm-2.5 rung (the `timeseries`
# ladder top). The rung is INERT without the feature: seasonal_naive
# (the built-in deterministic rung) always computes, the timesfm rung
# refuses loudly naming the missing feature; even with the feature on,
# the №334 contract still demands the Apache-2.0 weights fetched and
# SHA-verified on disk before real inference.
timesfm = []
# №567 (gh#931): the `server` feature is now a THIN no-op compat gate —
# the heavy stack moved to the metalogos-server crate (whose own
# `server` feature gates its axum runtime; default on there). The name
# is kept so the existing invocations (`--features server`, the
# default/full lists, the staying tests' `#[cfg(feature = "server")]`)
# remain valid; no root source is gated on it anymore.
# History: №278 made tokio optional behind this feature (the dep-graph
# deltas are recorded in docs/research/naryad-278-wasm-spike.md).
server = []
full = ["svg", "chart", "diagram", "template", "llm", "server"]

# Наряд №183 (ADR-0118): candle for sequence-layer (attention) extension.
# Off by default — adds significant build time and dependency surface.
# Enable with: cargo build --features candle
candle = ["dep:candle-core", "dep:candle-nn", "metalogos-reflex/candle"]

# Наряд №272 (ADR-0134): векторный контур языка — embed / vec_store /
# vec_search над vec0-таблицами. Off-by-default (ADR-0104 measured impact:
# дельта бинарника 0.15 MB, спайк №271); в portable включён по ADR-0134 D3.
vec = ["dep:sqlite-vec"]

# Optional OCR (pre-existing)
pdf-ocr = ["tesseract"]

# Наряд №210 (ADR-0122): Vision pillar skeleton. Off by default —
# инференс-стек подключается в R2/R3 по факту Go/No-Go (ADR-0123).
# Наряд №211 (R2): vision влечёт candle — текст-энкодер требует тензоров.
# Наряд №230: реализует implication через `vision = ["candle"]` (раньше
# `vision` подключал dep:candle-* параллельно с `candle`, но без включения
# самого `candle` feature-флага → `#[cfg(feature = "candle")]` модули
# `src/nn/` не компилировались; локальная `generate_uniform_f32` в
# `src/vision/text_encoder.rs` была обходным путём. Теперь implication
# работает как задокументировано, SSOT-PRNG доступен из vision-сборки).
# Наряд №212 (R3): vision влечёт tokenizers (HF BPE, нельзя вручную) +
# image (PNG encode VAE output).
# Enable with: cargo build --features vision
# №545 (в): tokenizers moved with the diffusion tokenizer module
# to the reflex crate (its `vision` feature); `image` stays
# (the provenance marks).
vision = ["candle", "dep:image", "metalogos-reflex/vision"]

# Наряд №302 (ADR-0143-0146): Voice pillar — TTS, voice cloning, voice design.
# Off-by-default: voice implies candle (same as vision). No new heavy deps in
# skeleton — candle-core/candle-nn reused. tokenizers may be added in A2+.
# Enable with: cargo build --features voice
voice = ["candle"]

# Наряд №307 (ADR-0147-0150): Video pillar — T2V/I2V, video design.
# Off-by-default: video implies candle (same as vision/voice).
# Enable with: cargo build --features video
video = ["candle"]

# CI-hygiene: максимальный фича-набор, переносимый между GitHub-hosted
# раннерами (platform-check джобы macos/windows в ci.yml). `pdf-ocr`
# исключён осознанно: по своему контракту (см. выше) он требует системные
# C-библиотеки tesseract-ocr + leptonica, которых нет на macos/windows
# раннерах — `--all-features` ломал сборку с момента добавления pdf-ocr
# (наряд №265). ПРАВИЛО: новая фича обязана попасть в `portable` либо
# документировать платформенное исключение рядом с собой в этом блоке.
# `vec` (№272/ADR-0134): C-компиляция через cc на всех трёх ОС
# (доказано спайком №271: macos/windows-check на ветке-спайке) —
# системных зависимостей не требует, в отличие от pdf-ocr.
portable = ["full", "candle", "vision", "vec"]

[dev-dependencies]
tempfile = "3"
serial_test = "4"
criterion = { version = "0.8", features = ["html_reports"] }
regex = "1"
# Naryad #277: property-based tests (Testing Evidence for grant applications).
proptest = "1"

[[bench]]
name = "core_benchmarks"
harness = false

# №567: the stage4_benchmark bench (№381, ADR-0141 §D5) moved to
# metalogos-server/benches/ — it benchmarks the transport
# (run_test_server_with_backend) and follows its subject; the fixtures
# stay at the repo root.


# Naryad №475 (issue #723): the filesystem ratchet.
#
# Every raw std::fs method call outside `src/fs_gate.rs` (the facade) and
# the explicitly justified service modules (#[allow] with a reason in the
# code: the weights store, the journal, the compile-time source loaders,
# the docs/test harness) is a CI error. All PROGRAM-INFLUENCED file
# operations must enter through `crate::fs_gate` (the №455 gate + the
# №475 write deny + the serve data-dir containment).
disallowed-methods = [
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::fs::remove_file",
  "std::fs::read_dir",
  "std::fs::File::open",
  "std::fs::File::create",
  "std::fs::OpenOptions::open",
  # №500 (issue #783): THIRD-PARTY path-APIs bypass the facade invisibly —
  # clippy sees std::fs but not the file I/O inside the crate. Route every
  # library load/save through `crate::fs_gate` (read_bytes → load_mem;
  # save_to → write_bytes). All eight routes through fs_gate (Naryad №500).
  "lopdf::Document::load",
  "lopdf::Document::save",
  "rusqlite::Connection::open",
  "image::open",
  "std::fs::copy",
  "std::fs::rename",
  "std::fs::remove_dir_all",
  "std::fs::create_dir_all",
]

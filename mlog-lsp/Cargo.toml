[package]
name = "mlog-lsp"
version.workspace = true
edition.workspace = true
description = "LSP server for METALOGOS (.mlog) files"

[[bin]]
name = "mlog-lsp"
path = "src/main.rs"

[dependencies]
metalogos = { path = ".." }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6"

[package]
name = "mlogpkg"
version.workspace = true
edition.workspace = true
description = "Package manager for METALOGOS (.mlog) projects"

[[bin]]
name = "mlogpkg"
path = "src/main.rs"

[dependencies]
metalogos = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"

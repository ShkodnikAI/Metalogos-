[package]
name = "mlogpkg"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Package manager for METALOGOS (.mlog) projects"

[[bin]]
name = "mlogpkg"
path = "src/main.rs"

[dependencies]
metalogos = { path = ".." }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
# №910 (ADR-0218): the digest signature — all three are ALREADY in the
# workspace graph (the root crate's crypto builtins), so Cargo.lock grows
# by ZERO entries (the supply-chain surface does not move).
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
# tempfile for unit tests that need a temporary registry directory.
# Note: the integration tests in tests/ use std::env::temp_dir() directly
# (no tempfile dep) so this is only for the #[cfg(test)] unit tests in main.rs.
tempfile = "3"
